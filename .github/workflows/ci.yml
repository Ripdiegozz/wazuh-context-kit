name: CI

# Hermetic on purpose: no WAZUH_CTX_NETWORK here. This job must be safe to run
# on every PR without depending on github.com/wazuh/* being reachable or
# unchanged (SPEC 5.1's opt-in network suite is a separate, slower guarantee).
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # The build target is Node (SPEC: shipped CLI targets Node >= 22), so the
      # smoke check runs under Node, not Bun, to catch anything Bun's runtime
      # would silently paper over.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Smoke test dist/cli.js
        run: |
          version="$(node dist/cli.js --version)"
          echo "reported version: ${version}"
          test "${version}" = "0.1.0"
