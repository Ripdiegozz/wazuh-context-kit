# Explicit repository list. NEVER derived by naming convention (SPEC 1.3).
#
# The organisation's naming is inconsistent and there are real collisions:
#   - wazuh-dashboard-reporting AND wazuh-dashboards-reporting both exist with a
#     5.0.0 branch, and `git ls-remote` shows both resolve to the IDENTICAL SHA
#     71b4b9e2d6252bec29468ca8ac4c4dd185f6c06a. They are mirrors, not rivals, so
#     the choice is cosmetic. RESOLVED 2026-09-15: keep the singular, which is
#     what the maintainer's working checkout uses. Closes SPEC section 8,
#     open decision 1.
#   - The security plugin is wazuh-security-dashboards-plugin,
#     not wazuh-dashboard-security.
#   - wazuh-dashboard-ml-commons exists but has no 5.0.0 branch.

refs:
  - "5.0.0"

repos:
  - { name: wazuh-dashboard, kind: platform }
  - { name: wazuh-dashboard-plugins, kind: dashboard }
  - { name: wazuh-dashboard-alerting, kind: dashboard }
  - { name: wazuh-dashboard-notifications, kind: dashboard }
  - { name: wazuh-dashboard-reporting, kind: dashboard }
  - { name: wazuh-dashboard-security-analytics, kind: dashboard }
  - { name: wazuh-security-dashboards-plugin, kind: dashboard }
  - { name: wazuh-indexer-plugins, kind: indexer }
  # Resolves a SHA and contributes ZERO facts, and that is expected -- not a bug.
  # It has a 5.0.0 branch but is a Java source repository (src/, commons/,
  # gradle/) holding none of the three declared `indexer` paths. Listed by a
  # deliberate maintainer decision on 2026-09-15, against the recommendation, as
  # a record that the repository was evaluated rather than overlooked.
  - { name: wazuh-indexer-security-analytics, kind: indexer }
  # Listed ON PURPOSE even though it has no 5.0.0 branch. fetch/ can only probe
  # a repository this file names, so leaving it out would make the "lands in
  # skipped[] by discovery" criterion (SPEC 1.9) impossible to prove: there
  # would be nothing for git ls-remote to come back empty about.
  - { name: wazuh-dashboard-ml-commons, kind: dashboard }

# Code-branch -> documentation-path mapping (SPEC 3.1).
# Hand-maintained prose. It has an owner and a review date, by rule.
#
# Do NOT derive these values from release tags. Measured 2026-09-17: the six 5.0
# prerelease tags collapse into the single published path /5.0-beta/, /current/
# is a byte-identical alias for /4.14/ that no tag encodes, and /5.0/ 404s even
# though branch 5.0.0 exists. `wazuh-ctx mcp --validate-docs-map` checks these
# entries against the live site and against release state; it never rewrites
# them.
docsVersionMap:
  owner: diego.garcia
  lastReviewed: "2026-09-17"
  map:
    # Was "5.0": every URL under that path returned 404. Wazuh 5.0 documentation
    # is published at /5.0-beta/ and there is no GA v5.0.0 tag yet -- the latest
    # is v5.0.0-beta5. This value moves when 5.0 goes GA; the validator is what
    # catches that day.
    "5.0.0": "5.0-beta"
    "4.14.0": "4.14"
